name: CUDA smoke test (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the Python extension and runs a small K-NNG check on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "python/**"
      - "tests/**"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0, simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@656f502ef4782d94d34d8ddd368e333960609639 # v0.1.8
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install numpy "setuptools<81"

      # The simulator runs PTX only (compute_90) and needs a shared CUDA
      # runtime. Same nvcc command as `make python_archNN`, with those flags.
      - name: Build the extension
        run: |
          nvcc -std=c++17 -O3 -arch=compute_90 --cudart shared \
               -Xcompiler -fPIC --shared \
               -o python/gpu_rsfk/librsfk.so src/python/pymodule_ext.cu

      # Fails on invalid indices, wrong distances or low recall against a
      # brute-force K-NN. The library has no CPU path; the grep also makes the
      # job fail if the simulated H100 was not initialised.
      - name: Run the K-NNG smoke test
        env:
          PYTHONPATH: python
        run: |
          vgpu run "$RUNNER_TEMP/venv/bin/python" tests/smoke_knn.py 2>&1 | tee smoke.log
          grep -q "virtual GPU platform initialized: 1 x nvidia/h100" smoke.log
          grep -q "^PASS" smoke.log
